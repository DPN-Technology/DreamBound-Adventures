  <text x="640" y="407" fill="#d8fff0" opacity=".82" text-anchor="middle" font-family="monospace" font-size="13" letter-spacing="2">01000100 • EXPLORE • CREATE • DISCOVER • PLAY TOGETHER • 01010000</text>
