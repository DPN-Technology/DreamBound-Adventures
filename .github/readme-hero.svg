    <text x="640" y="160" fill="#ffffff" font-size="74" font-weight="900" letter-spacing="2">DREAMBOUND</text>
    <text x="640" y="205" fill="url(#dream)" font-size="34" font-weight="900" letter-spacing="13">ADVENTURES</text>
    <text x="640" y="246" fill="#f5efff" font-size="20" font-weight="700">Every Adventure Starts With Imagination.</text>
  </g>

  <g transform="translate(392 268)" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" text-anchor="middle">
