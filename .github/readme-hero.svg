    <circle cx="86" cy="72" r="3"/><circle cx="185" cy="116" r="2.5"/><circle cx="302" cy="54" r="4"/><circle cx="929" cy="57" r="3"/><circle cx="986" cy="143" r="2.5"/><circle cx="1177" cy="176" r="3.5"/>
    <path d="M230 78 l5 10 10 5-10 5-5 10-5-10-10-5 10-5z" opacity=".9"/>
    <path d="M885 112 l4 8 8 4-8 4-4 8-4-8-8-4 8-4z" opacity=".8"/>
  </g>

