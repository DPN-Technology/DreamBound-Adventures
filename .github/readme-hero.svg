<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="430" viewBox="0 0 1280 430" role="img" aria-labelledby="title desc">
  <title id="title">DreamBound Adventures by DPN Technology</title>
  <desc id="desc">A colorful child-friendly DPN Technology hero with a magical landscape, moon, rocket, stars, binary rain, and DreamBound branding.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#080b20"/><stop offset=".42" stop-color="#231451"/><stop offset=".72" stop-color="#163d67"/><stop offset="1" stop-color="#0c6571"/>
    </linearGradient>
    <radialGradient id="moon" cx=".35" cy=".3" r=".8"><stop stop-color="#fffbdc"/><stop offset=".65" stop-color="#d9dcff"/><stop offset="1" stop-color="#9f8dff"/></radialGradient>
    <linearGradient id="dream" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff6ab9"/><stop offset=".34" stop-color="#a97bff"/><stop offset=".68" stop-color="#57ddf1"/><stop offset="1" stop-color="#6cf5a0"/></linearGradient>
    <linearGradient id="hill1" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3dd58c"/><stop offset="1" stop-color="#157463"/></linearGradient>
    <linearGradient id="hill2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6a52cf"/><stop offset="1" stop-color="#2e256e"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
    <pattern id="binary" width="88" height="56" patternUnits="userSpaceOnUse">
      <text x="0" y="18" font-family="monospace" font-size="12" fill="#7ff4ef" opacity=".13">010101</text>
      <text x="22" y="44" font-family="monospace" font-size="12" fill="#ff75bd" opacity=".10">101001</text>
    </pattern>
  </defs>

  <rect width="1280" height="430" rx="32" fill="url(#bg)"/>
  <rect width="1280" height="430" rx="32" fill="url(#binary)"/>

  <circle cx="1090" cy="92" r="73" fill="#ab93ff" opacity=".18" filter="url(#soft)"/>
  <circle cx="1090" cy="92" r="48" fill="url(#moon)" filter="url(#glow)"/>
  <circle cx="1072" cy="79" r="8" fill="#9388cf" opacity=".35"/>
  <circle cx="1111" cy="103" r="6" fill="#9388cf" opacity=".25"/>
  <circle cx="1094" cy="60" r="4" fill="#9388cf" opacity=".22"/>

