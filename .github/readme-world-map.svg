<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">DreamBound adventure journey</title>
  <desc id="desc">A visual journey connecting Storybook World, Space Center, Moon exploration, Lunar Station, and Living World systems.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#11152e"/>
      <stop offset="1" stop-color="#1b204b"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#ff6fbd"/>
      <stop offset=".25" stop-color="#a97bff"/>
      <stop offset=".55" stop-color="#55dff0"/>
      <stop offset=".8" stop-color="#6fe39b"/>
      <stop offset="1" stop-color="#ffd66f"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1280" height="320" rx="28" fill="url(#bg)"/>
  <text x="48" y="44" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="900" letter-spacing="4">YOUR DREAMBOUND JOURNEY</text>
  <text x="1232" y="44" text-anchor="end" fill="#a8b0dc" font-family="monospace" font-size="12">ONE UNIVERSE • GROWING SYSTEMS</text>

  <path d="M125 170 C250 112 310 220 430 166 C535 119 624 215 744 160 C860 106 951 214 1150 145" fill="none" stroke="#ffffff" opacity=".08" stroke-width="18"/>
  <path d="M125 170 C250 112 310 220 430 166 C535 119 624 215 744 160 C860 106 951 214 1150 145" fill="none" stroke="url(#path)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <g transform="translate(125 170)">
      <circle r="43" fill="#1a183d" stroke="#ff6fbd" stroke-width="3"/>
      <path d="M-19 15 h38 v-30 h-38z M-10-15 v-14 M10-15 v-14 M0-39 l12 10 h-24z" fill="none" stroke="#ff9bd2" stroke-width="4" stroke-linejoin="round"/>
      <text y="75" fill="#ffffff" font-size="16" font-weight="900">STORYBOOK WORLD</text>
      <text y="97" fill="#c8c4e7" font-size="12">6 lands • stories • co-op</text>
    </g>

    <g transform="translate(380 170)">
      <circle r="43" fill="#1a183d" stroke="#a97bff" stroke-width="3"/>
      <rect x="-19" y="-19" width="38" height="38" rx="7" fill="none" stroke="#c9adff" stroke-width="4"/>
      <path d="M-28 0 h9 M19 0 h9 M0-28 v9 M0 19 v9" stroke="#c9adff" stroke-width="4" stroke-linecap="round"/>
      <circle r="7" fill="#ffffff"/>
      <text y="75" fill="#ffffff" font-size="16" font-weight="900">SPACE CENTER</text>
      <text y="97" fill="#c8c4e7" font-size="12">puzzles • engineering • launch</text>
    </g>

    <g transform="translate(635 170)">
      <circle r="43" fill="#1a183d" stroke="#55dff0" stroke-width="3"/>
      <circle r="24" fill="none" stroke="#89eff7" stroke-width="4"/>
      <path d="M-20 9 c12-10 27-12 41-4 M-10-18 c8 6 13 13 15 23" fill="none" stroke="#89eff7" stroke-width="3" stroke-linecap="round"/>
      <text y="75" fill="#ffffff" font-size="16" font-weight="900">THE MOON</text>
      <text y="97" fill="#c8c4e7" font-size="12">rover • discoveries • Luma</text>
    </g>

    <g transform="translate(890 170)">
      <circle r="43" fill="#1a183d" stroke="#6fe39b" stroke-width="3"/>
      <path d="M-24 17 h48 v-30 h-48z M-15-13 v-13 h30 v13 M-11 17 v-17 h22 v17" fill="none" stroke="#9af0ba" stroke-width="4" stroke-linejoin="round"/>
      <text y="75" fill="#ffffff" font-size="16" font-weight="900">LUNAR STATION</text>
      <text y="97" fill="#c8c4e7" font-size="12">walkable interior • missions</text>
    </g>

    <g transform="translate(1150 145)">
      <circle r="43" fill="#1a183d" stroke="#ffd66f" stroke-width="3"/>
      <path d="M0-24 l7 16 17 2-13 11 4 17-15-9-15 9 4-17-13-11 17-2z" fill="none" stroke="#ffe79a" stroke-width="3"/>
      <text y="100" fill="#ffffff" font-size="16" font-weight="900">LIVING WORLD</text>
      <text y="122" fill="#c8c4e7" font-size="12">events • NPCs • base • mastery</text>
    </g>
  </g>

  <g transform="translate(510 273)" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="800">
    <rect width="260" height="30" rx="15" fill="#ffffff0a" stroke="#6b7096"/>
    <text x="130" y="20" text-anchor="middle" fill="#d5d8f0">STORYBOOK + ADVANCED WORLD</text>
  </g>
</svg>
