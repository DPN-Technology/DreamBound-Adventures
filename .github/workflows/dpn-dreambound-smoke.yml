name: DPN DreamBound Game Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-runtime:
    name: Local Runtime Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Start local game server
        shell: bash
        run: |
          python3 serve_dreambound.py --port 4173 --no-open > /tmp/dreambound-http.log 2>&1 &
          echo $! > /tmp/dreambound-http.pid
      - name: Verify game shell
        shell: bash
        run: |
          for i in {1..15}; do
            if curl --fail --silent --show-error --max-time 2 http://127.0.0.1:4173/index.html -o /tmp/index.html; then break; fi
            sleep 1
          done
          curl --fail --silent --show-error --max-time 2 http://127.0.0.1:4173/vnext.html -o /tmp/vnext.html
          curl --fail --silent --show-error --max-time 2 http://127.0.0.1:4173/src/vnext/core.js -o /tmp/vnext-core.js
          curl --fail --silent --show-error --max-time 2 http://127.0.0.1:4173/src/vnext/bootstrap.js -o /tmp/vnext-bootstrap.js
          curl --fail --silent --show-error --max-time 2 http://127.0.0.1:4173/src/vnext/lunar-guardian.js -o /tmp/vnext-lunar.js
          curl --fail --silent --show-error --max-time 2 http://127.0.0.1:4173/src/vnext/engine/fx.js -o /tmp/vnext-fx.js
          curl --fail --silent --show-error --max-time 2 http://127.0.0.1:4173/src/vnext/engine/scenes.js -o /tmp/vnext-scenes.js
          curl --fail --silent --show-error --max-time 2 http://127.0.0.1:4173/src/vnext/engine/quests.js -o /tmp/vnext-quests.js
          curl --fail --silent --show-error --max-time 2 http://127.0.0.1:4173/src/vnext/engine/world-events.js -o /tmp/vnext-world-events.js
          curl --fail --silent --show-error --max-time 2 http://127.0.0.1:4173/src/vnext/engine/base-builder.js -o /tmp/vnext-base-builder.js
          curl --fail --silent --show-error --max-time 2 http://127.0.0.1:4173/src/vnext/engine/npcs.js -o /tmp/vnext-npcs.js
          curl --fail --silent --show-error --max-time 2 http://127.0.0.1:4173/src/vnext/engine/codex.js -o /tmp/vnext-codex.js
          curl --fail --silent --show-error --max-time 2 http://127.0.0.1:4173/src/vnext/engine/cinematic.js -o /tmp/vnext-cinematic.js
          curl --fail --silent --show-error --max-time 2 http://127.0.0.1:4173/src/vnext/engine/adventure-director.js -o /tmp/vnext-director.js
          curl --fail --silent --show-error --max-time 2 http://127.0.0.1:4173/src/vnext/engine/achievements.js -o /tmp/vnext-achievements.js
          curl --fail --silent --show-error --max-time 2 http://127.0.0.1:4173/src/vnext/engine/odyssey.js -o /tmp/vnext-odyssey.js
          curl --fail --silent --show-error --max-time 2 http://127.0.0.1:4173/src/vnext/engine/adventure-deck.js -o /tmp/vnext-adventure-deck.js
          grep -qi "DreamBound" /tmp/index.html
          test -s /tmp/vnext.html
          test -s /tmp/vnext-core.js
          test -s /tmp/vnext-bootstrap.js
          test -s /tmp/vnext-lunar.js
          test -s /tmp/vnext-fx.js
          test -s /tmp/vnext-scenes.js
          test -s /tmp/vnext-quests.js
          test -s /tmp/vnext-world-events.js
          test -s /tmp/vnext-base-builder.js
          test -s /tmp/vnext-npcs.js
          test -s /tmp/vnext-codex.js
          test -s /tmp/vnext-cinematic.js
          test -s /tmp/vnext-director.js
          test -s /tmp/vnext-achievements.js
          test -s /tmp/vnext-odyssey.js
          test -s /tmp/vnext-adventure-deck.js
          grep -qi "Odyssey Network" /tmp/index.html
          grep -qi "UNIFIED LIVING WORLD" /tmp/index.html
          grep -q "Explorer Rank" /tmp/vnext-odyssey.js
          grep -q "Adventure Deck" /tmp/vnext-adventure-deck.js
          echo "DreamBound local runtime shell: reachable on loopback only"
      - name: Verify security headers
        shell: bash
        run: |
          curl --fail --silent --show-error --head http://127.0.0.1:4173/index.html > /tmp/headers.txt
          grep -qi "^Content-Security-Policy:.*connect-src 'none'" /tmp/headers.txt
          grep -qi "^X-Content-Type-Options: nosniff" /tmp/headers.txt
          grep -qi "^X-Frame-Options: DENY" /tmp/headers.txt
          grep -qi "^Referrer-Policy: no-referrer" /tmp/headers.txt
      - name: Stop local server
        if: always()
        shell: bash
        run: |
          if test -f /tmp/dreambound-http.pid; then
            kill "$(cat /tmp/dreambound-http.pid)" 2>/dev/null || true
          fi
