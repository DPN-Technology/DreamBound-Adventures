name: DPN DreamBound Game Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-runtime:
    name: Local Runtime Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Start local game server
        shell: bash
        run: |
          python3 serve_dreambound.py --port 4173 --no-open > /tmp/dreambound-http.log 2>&1 &
          echo $! > /tmp/dreambound-http.pid
      - name: Verify unified game shell
        shell: bash
        run: |
          for i in {1..15}; do
            if curl --fail --silent --show-error --max-time 2 http://127.0.0.1:4173/index.html -o /tmp/index.html; then break; fi
            sleep 1
          done
          curl --fail --silent --show-error --max-time 2 http://127.0.0.1:4173/vnext.html -o /tmp/vnext.html
          curl --fail --silent --show-error --max-time 2 http://127.0.0.1:4173/vnext.css -o /tmp/vnext.css
          curl --fail --silent --show-error --max-time 2 http://127.0.0.1:4173/safe-dom.js -o /tmp/safe-dom.js
          curl --fail --silent --show-error --max-time 2 http://127.0.0.1:4173/src/vnext/core.js -o /tmp/core.js
          curl --fail --silent --show-error --max-time 2 http://127.0.0.1:4173/src/vnext/bootstrap.js -o /tmp/bootstrap.js
          curl --fail --silent --show-error --max-time 2 http://127.0.0.1:4173/src/vnext/engine/scenes.js -o /tmp/scenes.js
          curl --fail --silent --show-error --max-time 2 http://127.0.0.1:4173/src/vnext/engine/unified-realms.js -o /tmp/unified-realms.js
          curl --fail --silent --show-error --max-time 2 http://127.0.0.1:4173/src/vnext/engine/unified-world.css -o /tmp/unified-world.css
          grep -q "UNIFIED LIVING WORLD" /tmp/index.html
          grep -q "src/vnext/engine/unified-realms.js" /tmp/index.html
          grep -q "DreamGate Atlas" /tmp/unified-realms.js
          grep -q "url=index.html" /tmp/vnext.html
          test -s /tmp/vnext.css
          test -s /tmp/safe-dom.js
          test -s /tmp/core.js
          test -s /tmp/bootstrap.js
          test -s /tmp/scenes.js
          test -s /tmp/unified-world.css
          for legacy in game.js styles.css profile-sanitizer.js dom-collection-bridge.js; do
            code="$(curl --silent --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:4173/$legacy")"
            test "$code" = "404"
          done
          echo "DreamBound unified runtime: reachable; legacy runtime: not served"
      - name: Verify security headers
        shell: bash
        run: |
          curl --fail --silent --show-error --head http://127.0.0.1:4173/index.html > /tmp/headers.txt
          grep -qi "^Content-Security-Policy:.*connect-src 'none'" /tmp/headers.txt
          grep -qi "^X-Content-Type-Options: nosniff" /tmp/headers.txt
          grep -qi "^X-Frame-Options: DENY" /tmp/headers.txt
          grep -qi "^Referrer-Policy: no-referrer" /tmp/headers.txt
      - name: Stop local server
        if: always()
        shell: bash
        run: |
          if test -f /tmp/dreambound-http.pid; then
            kill "$(cat /tmp/dreambound-http.pid)" 2>/dev/null || true
          fi
