name: DPN DreamBound Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dreambound-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-integrity:
    name: Source Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: node --check game.js
      - name: Conflict marker guard
        shell: bash
        run: |
          if grep -RInE '^(<<<<<<<|=======|>>>>>>>)' --exclude-dir=.git .; then
            echo "::error::Merge conflict markers detected."
            exit 1
          fi
      - name: DreamBound repository validator
        run: python3 tools/validate_dreambound.py --mode integrity
      - name: Legacy co-op migration contract
        run: python3 tools/check_coop_contract.py
      - name: Workflow security contract
        run: python3 tools/check_workflow_security.py
      - name: Legacy story migration contract
        run: python3 tools/check_story_contract.py
      - name: Runtime security contract
        run: python3 tools/check_runtime_security.py
      - name: Raw DOM sink guard
        run: python3 tools/check_dom_sinks.py
      - name: Profile sanitizer fuzz
        run: node tools/fuzz_profile_sanitizer.js
      - name: Legacy expansion migration contract
        run: python3 tools/check_world_expansion_contract.py
      - name: Legacy DOM migration debt guard
        run: python3 tools/check_dom_collection_bridge.py
      - name: Modular runtime syntax
        shell: bash
        run: |
          find src/vnext -type f -name "*.js" -print0 | while IFS= read -r -d '' file; do node --check "$file"; done
      - name: Modular runtime contract
        run: python3 tools/check_modular_runtime.py
      - name: Advanced engine contract
        run: python3 tools/check_advanced_engine.py
      - name: Living World contract
        run: python3 tools/check_living_world.py
      - name: DreamCreature ecology contract
        run: python3 tools/check_living_ecology.py
      - name: Living NPC routines contract
        run: python3 tools/check_living_npcs.py
      - name: World systems contract
        run: python3 tools/check_world_systems.py
      - name: Cinematic story arc contract
        run: python3 tools/check_story_arcs.py
      - name: Director and Mastery contract
        run: python3 tools/check_v12_director.py
      - name: Odyssey Network contract
        run: python3 tools/check_odyssey_network.py
      - name: Procedural living adventures contract
        run: python3 tools/check_procedural_adventures.py
      - name: Accessibility performance contract
        run: python3 tools/check_accessibility_performance.py
      - name: v2 simulation kernel contract
        run: python3 tools/check_simulation_kernel.py
      - name: v2 autonomous world contract
        run: python3 tools/check_autonomous_world.py
      - name: v2 systemic quest chains contract
        run: python3 tools/check_systemic_chains.py
      - name: v2 traversal progression contract
        run: python3 tools/check_traversal_progression.py
      - name: v2 environmental network contract
        run: python3 tools/check_environment_network.py
      - name: v2 emergent ecology contract
        run: python3 tools/check_emergent_ecology.py
      - name: v2 world memory contract
        run: python3 tools/check_world_memory.py
      - name: Unified realm contract
        run: python3 tools/check_unified_realms.py
      - name: vNext state fuzz
        run: node tools/fuzz_vnext_state.js

  child-safety:
    name: DreamShield Child Safety
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Child-safety runtime policy
        run: python3 tools/validate_dreambound.py --mode child-safety

  security-baseline:
    name: Security Baseline
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Dangerous API and secret-pattern guard
        run: python3 tools/validate_dreambound.py --mode security

  policy:
    name: Policy Files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify policy surface
        shell: bash
        run: |
          test -s SECURITY.md
          test -s CONTRIBUTING.md
          test -s docs/THREAT_MODEL.md
          test -s docs/SECURITY_GATES.md
          test -s .github/CODEOWNERS
          test -s .github/dependabot.yml
          test -s THIRD_PARTY_LICENSES.md

  green-gate:
    name: DreamShield Green Gate
    if: always()
    needs: [source-integrity, child-safety, security-baseline, policy]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate gates
        env:
          SOURCE: ${{ needs.source-integrity.result }}
          CHILD: ${{ needs.child-safety.result }}
          SECURITY: ${{ needs.security-baseline.result }}
          POLICY: ${{ needs.policy.result }}
        run: |
          echo "Source Integrity: $SOURCE"
          echo "Child Safety: $CHILD"
          echo "Security Baseline: $SECURITY"
          echo "Policy Files: $POLICY"
          test "$SOURCE" = "success"
          test "$CHILD" = "success"
          test "$SECURITY" = "success"
          test "$POLICY" = "success"
          echo "DPN DREAMSHIELD: GREEN"
