name: DPN DreamBound ClusterFuzzLite

on:
  pull_request:
    branches: [main]
    paths:
      - "serve_dreambound.py"
      - "fuzz/**"
      - ".clusterfuzzlite/**"
      - ".github/workflows/dpn-dreambound-fuzz.yml"
  schedule:
    - cron: "17 9 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: ClusterFuzzLite Path Boundary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Build fuzzers
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          language: python
          sanitizer: address

      - name: Run fuzzers
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 120
          mode: code-change
          sanitizer: address
          output-sarif: true

      - name: Upload fuzzing SARIF
        if: always() && steps.run.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: ${{ steps.run.outputs.sarif }}
