name: DPN Enterprise Green Gate

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  green-gate:
    uses: DPN-Technology/.github/.github/workflows/dpn-green-gate.yml@3441e08741c0f1cb10b3463708afaaa42e63a78c
    with:
      lifecycle: development
      enterprise_mode: audit
      require_security_policy: true
      require_dependency_record: false
      require_runbook: false
      require_codeowners: false
      require_pr_template: false
      require_action_sha_pinning: true
      require_explicit_workflow_permissions: true
