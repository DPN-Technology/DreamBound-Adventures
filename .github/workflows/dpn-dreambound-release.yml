name: DPN DreamBound Release Integrity

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Validate, Attest and Package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate release source
        shell: bash
        run: |
          node --check game.js
          python3 tools/validate_dreambound.py --mode all
          python3 tools/check_coop_contract.py
          python3 tools/check_workflow_security.py
          python3 tools/check_runtime_security.py
          node tools/fuzz_profile_sanitizer.js
          python3 tools/check_dom_collection_bridge.py
          for file in src/vnext/*.js; do node --check "$file"; done
          python3 tools/check_modular_runtime.py
      - name: Build source package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME:-manual-${GITHUB_RUN_NUMBER}}"
          NAME="DreamBound-Adventures-${VERSION}"
          mkdir -p "dist/${NAME}"
          cp index.html styles.css game.js profile-sanitizer.js dom-collection-bridge.js serve_dreambound.py vnext.html vnext.css PLAY-DREAMBOUND.bat PLAY-DREAMBOUND.ps1 README.md CHANGELOG.md BRAND-TRANSITION.md VERIFICATION.md SECURITY.md THIRD_PARTY_LICENSES.md "dist/${NAME}/"\n          mkdir -p "dist/${NAME}/src"\n          cp -R src/vnext "dist/${NAME}/src/vnext"
          cp -R docs "dist/${NAME}/docs"
          (cd dist && zip -qr "${NAME}.zip" "${NAME}")
          (cd dist && sha256sum "${NAME}.zip" > "${NAME}.zip.sha256")
      - name: Attest release package provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*.zip"
      - name: Upload validated package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dreambound-release
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: Publish Tagged Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - name: Download validated package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dreambound-release
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256             --repo "$GITHUB_REPOSITORY"             --title "DreamBound Adventures $GITHUB_REF_NAME"             --generate-notes
